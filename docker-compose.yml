services:
  etl:
    build:
      context: .
      target: base
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs

  tests:
    build:
      context: .
      target: dev

  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  load:
    build:
      context: .
      target: base
    command: python -m pulseiq.load
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./sql:/app/sql:ro

volumes:
  pgdata:
