      code: 'Key takeaways (all departments; text does not change with filters)


        - Headcount grew from 393 to 441 in 12 months (+12%).

        - Engineering holds 167 of 441 people (38%); Executive Office has 1.

        - 99 of 441 people (22%) have under 1 year of tenure; 32 have 10 or more.

        - Levels 2 and 3 make up 262 of 441 people (59%).

        - 17 joined and 3 left in Sep 2026; joiners outnumbered leavers in 9 of the
        last 12 months.'
