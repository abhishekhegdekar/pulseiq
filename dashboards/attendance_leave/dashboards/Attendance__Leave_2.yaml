  MARKDOWN-AcuOhVwG0_EbyWQaD-FF7:
    children: []
    id: MARKDOWN-AcuOhVwG0_EbyWQaD-FF7
    meta:
      code: 'Takeaway: Leave starts are spread fairly evenly across weekdays, from
        575 on Monday to 650 on Thursday, so there is no strong weekday pattern. Of
        the 221 AI/ML flagged employee-months, 38 are confirmed by the monthly data,
        55 are contradicted and 128 cannot be checked. Treat the flags as a review
        list, not as findings.'
      height: 15
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-urnlFCmHhBs3xZpx4Teqj
    type: MARKDOWN
  MARKDOWN-FbzeF3WwNfvLu11puO8Oi:
    children: []
    id: MARKDOWN-FbzeF3WwNfvLu11puO8Oi
    meta:
      code: 'Takeaway: Attendance runs from 95.2% (Sales) down to 88.7% (Finance &
        Accounts). Finance & Accounts is a small team where a few long maternity leaves
        pull the rate down, so it is not a sign of a broad problem. Earned, Casual
        and Sick leave account for most approved leave days.'
      height: 11
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-sg0TRvTKz_gfr-CjEirbM
    type: MARKDOWN
  MARKDOWN-GWk5c3hJ6P2dmzwAfE-Ja:
    children: []
    id: MARKDOWN-GWk5c3hJ6P2dmzwAfE-Ja
    meta:
      code: 'Takeaway: Company attendance stays in a narrow band, about 93% to 95.5%
        a month. The 3-month rate fell from a peak near 95.3% to a low near 93.2%
        and has since recovered to about 94.5%. December sits between November and
        January with no December-specific drop, but with only one December in the
        data, seasonality cannot be tested.'
      height: 13
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-7QuwMBvXMN31bauxeFCKZ
    type: MARKDOWN
  MARKDOWN-XA1LEt4oYRrve6KqcYU67:
    children: []
    id: MARKDOWN-XA1LEt4oYRrve6KqcYU67
    meta:
      code: "Attendance & Leave \xB7 data to 30 Sep 2026 \xB7 synthetic (fake) data\n\
        \n- Attendance rate = (present days + half of unpaid half-days) \xF7 scheduled\
        \ days. Paid leave counts as not present.\n- Late rate = late arrivals \xF7\
        \ present days.\n- The Department filter applies to the attendance, late-arrival\
        \ and AI-flag charts. The two leave charts are company-wide.\n- Departments\
        \ with fewer than 5 people are hidden, and the one-person Executive Office\
        \ is excluded.\n- Attendance data is monthly, so \"weekday\" means the weekday\
        \ a leave starts, not when people were absent."
      height: 33
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-tXucsmushPQlu2kA7fb70
    type: MARKDOWN
  MARKDOWN-kJ-qdL_Mox-swYcJDJw2o:
    children: []
    id: MARKDOWN-kJ-qdL_Mox-swYcJDJw2o
    meta:
      code: 'Takeaway: The monthly late rate moves between about 6.3% and 7.5%, peaking
        in March 2026. By department, Operations & IT (8.7%) and Legal & Compliance
        (7.6%) are clearly above the rest, which sit between 6.3% and 6.9%.'
      height: 11
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-UbfXY7rl4B50drB65If3J
    type: MARKDOWN
